name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Check changed files
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BEFORE_SHA="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
          fi
          echo "BEFORE_SHA=$BEFORE_SHA" >> "$GITHUB_ENV"
          pnpm check:changed-files "$BEFORE_SHA" --secretlint
      - run: pnpm audit --prod
      - run: pnpm build
      - run: pnpm format:check "$BEFORE_SHA"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @tastes/admin exec playwright install --with-deps chromium
      - run: pnpm test:e2e
