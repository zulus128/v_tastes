packages:
  - apps/*
  - services/backend/functions
  - packages/*

allowBuilds:
  '@firebase/util': true
  esbuild: true
  node: true
  protobufjs: true
  re2: true

peerDependencyRules:
  allowedVersions:
    '@react-native/jest-preset': 0.86.2

overrides:
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  'fast-xml-parser@>=5.9.3 <5.10.1': 5.10.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'nanoid@<3.3.17': 3.3.17
  'postcss@<=8.5.22': 8.5.23
  'uuid@<11.1.1': 11.1.1
