packages:
  - apps/*
  - services/backend/functions
  - packages/*

allowBuilds:
  '@firebase/util': true
  esbuild: true
  node: true
  protobufjs: true
  re2: true

peerDependencyRules:
  allowedVersions:
    '@react-native/jest-preset': 0.86.2

audit:
  # Temporary upstream exception; remove when image-size >=2.0.3 is published.
  ignore:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

overrides:
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  'nanoid@3': 3.3.18
  'js-yaml@3': 3.15.2
  'js-yaml@4': 4.3.2
  '@xmldom/xmldom@>=0.8.0 <0.9.0': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.10.0': 0.9.12
  '@react-navigation/core@<7.22.1': 7.22.1
  'baseline-browser-mapping@<2.11.0': 2.11.0
  'browserslist@<4.28.7': 4.28.7
  'fast-xml-parser@>=5.9.3 <5.10.1': 5.10.1
  'postcss@<=8.5.22': 8.5.23
  'qs@<6.16.0': 6.16.0
  'sharp@<0.35.4': 0.35.4
  'uuid@<11.1.1': 11.1.1

minimumReleaseAgeExclude:
  - '@react-navigation/core@7.22.1'
