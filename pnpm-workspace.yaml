packages:
  - apps/*
  - services/backend/functions
  - packages/*

allowBuilds:
  '@firebase/util': true
  dtrace-provider: false
  esbuild: true
  node: true
  protobufjs: true
  re2: true

peerDependencyRules:
  allowedVersions:
    '@react-native/jest-preset': 0.86.2

audit:
  # Temporary upstream exception; remove when image-size >=2.0.3 is published.
  ignore:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # Temporary upstream exceptions; no patched release is available yet.
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c

overrides:
  'brace-expansion@<2': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  '@fastify/busboy@<3.2.2': 3.2.2
  '@grpc/grpc-js@<1.14.5': 1.14.5
  'compression@<1.8.2': 1.8.2
  'joi@<17.13.8': 17.13.8
  'nanoid@3': 3.3.18
  'js-yaml@3': 3.15.2
  'js-yaml@4': 4.3.2
  '@xmldom/xmldom@>=0.8.0 <0.9.0': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.10.0': 0.9.12
  '@react-navigation/core@<7.22.1': 7.22.1
  'baseline-browser-mapping@<2.11.0': 2.11.0
  'browserslist@<4.28.7': 4.28.7
  'fast-xml-parser@>=5.9.3 <5.10.1': 5.10.1
  'postcss@<=8.5.22': 8.5.23
  'qs@<6.16.0': 6.16.0
  'proxy-addr@<2.0.8': 2.0.8
  'sharp@<0.35.5': 0.35.5
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'uuid@<11.1.1': 11.1.1

minimumReleaseAgeExclude:
  - '@react-navigation/core@7.22.1'
